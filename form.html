<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borang Survey Lapangan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-6 md:p-8">
        
        <!-- Pengepala Borang -->
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-blue-100 text-blue-600 mb-3">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
            </div>
            <h2 class="text-2xl font-bold text-gray-800">Survey Lapangan</h2>
            <p class="text-sm text-gray-500 mt-1">Laporan Aktiviti Kawalan Denggi (ACD)</p>
        </div>

        <!-- Kotak Status GPS & Pilihan Mod -->
        <div class="mb-5">
            <div class="flex justify-between items-center mb-2">
                <span class="text-xs font-semibold text-gray-600 uppercase tracking-wider">Mod Lokasi:</span>
                <!-- Butang Tukar Mod Auto / Manual -->
                <button type="button" id="btnToggleMod" onclick="tukarModInput()" class="text-xs font-medium text-blue-600 hover:text-blue-800 underline focus:outline-none">
                    Tukar ke Masukan Manual
                </button>
            </div>

            <div id="statusLokasi" class="flex items-start p-3 rounded-lg bg-blue-50 text-blue-700 text-sm border border-blue-200 transition-colors duration-300">
                <svg id="statusIcon" class="w-5 h-5 mr-2 mt-0.5 animate-pulse flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                <div class="flex-grow">
                    <span id="statusText">Sedang mendapatkan lokasi GPS semasa...</span>
                </div>
            </div>

            <!-- Butang Segar Semula GPS (Untuk Auto Mode) -->
            <div id="wrapperBtnRefresh" class="mt-2">
                <button type="button" onclick="dapatkanLokasi()" class="w-full py-2 px-3 bg-blue-50 hover:bg-blue-100 text-blue-700 text-xs font-semibold rounded-lg border border-blue-200 transition-all flex items-center justify-center">
                    <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    Segar Semula / Kemas Kini GPS Semasa
                </button>
            </div>
        </div>

        <!-- Borang Utama -->
        <form id="surveyForm" class="space-y-4">
            
            <!-- Ruangan Nama -->
            <div>
                <label for="nama" class="block text-sm font-medium text-gray-700 mb-1">Nama Staf / Pasukan</label>
                <input type="text" id="nama" required placeholder="Cth: Ahmad atau Pasukan A" 
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
            </div>

            <!-- Bahagian Koordinat (Auto atau Manual) -->
            <div id="bahagianKoordinat" class="grid grid-cols-2 gap-3 p-3 bg-gray-50 rounded-lg border border-gray-200">
                <div>
                    <label for="lat" class="block text-xs font-medium text-gray-600 mb-1">Latitud</label>
                    <input type="text" id="lat" required readonly placeholder="Latitud" 
                           class="w-full px-3 py-1.5 text-sm bg-white border border-gray-300 rounded-md focus:ring-1 focus:ring-blue-500 outline-none transition-all">
                </div>
                <div>
                    <label for="lng" class="block text-xs font-medium text-gray-600 mb-1">Longitud</label>
                    <input type="text" id="lng" required readonly placeholder="Longitud" 
                           class="w-full px-3 py-1.5 text-sm bg-white border border-gray-300 rounded-md focus:ring-1 focus:ring-blue-500 outline-none transition-all">
                </div>
                <div class="col-span-2 text-xs text-gray-500" id="infoKoordinatNota">
                    Koordinat dikemas kini secara automatik dari GPS peranti anda.
                </div>
            </div>

            <!-- Ruangan Maklumat -->
            <div>
                <label for="nota" class="block text-sm font-medium text-gray-700 mb-1">Maklumat / Nota Survey</label>
                <textarea id="nota" rows="4" required placeholder="Masukkan maklumat kawalan, status pembiakan, dsb..." 
                          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all resize-none"></textarea>
            </div>

            <!-- Butang Hantar -->
            <button type="submit" id="btnSubmit" disabled 
                    class="w-full mt-4 bg-gray-400 text-white font-semibold py-3 px-4 rounded-lg cursor-not-allowed transition-all duration-300 flex justify-center items-center">
                <span id="btnText">Menunggu Lokasi...</span>
            </button>
        </form>
    </div>

    <!-- Custom Modal (Menggantikan fungsi alert()) -->
    <div id="successModal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4 transition-opacity duration-300">
        <div class="bg-white rounded-2xl shadow-2xl p-6 w-full max-w-sm text-center transform scale-100 transition-transform duration-300">
            <div class="mx-auto flex items-center justify-center h-16 w-16 rounded-full bg-green-100 mb-4">
                <svg class="h-8 w-8 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                </svg>
            </div>
            <h3 class="text-xl font-bold text-gray-900 mb-2">Berjaya Dihantar!</h3>
            <p class="text-gray-600 text-sm mb-6" id="modalMessage">Data kaji selidik dan rekod GPS telah berjaya dihantar ke sistem.</p>
            <button type="button" onclick="tutupModal()" 
                    class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-2.5 px-4 rounded-lg transition-colors duration-200">
                Tutup & Sambung Survey Seterusnya
            </button>
        </div>
    </div>

    <script>
        // DOM Elements
        const statusLokasi = document.getElementById('statusLokasi');
        const statusText = document.getElementById('statusText');
        const statusIcon = document.getElementById('statusIcon');
        const btnSubmit = document.getElementById('btnSubmit');
        const btnText = document.getElementById('btnText');
        const latInput = document.getElementById('lat');
        const lngInput = document.getElementById('lng');
        const surveyForm = document.getElementById('surveyForm');
        const successModal = document.getElementById('successModal');
        const btnToggleMod = document.getElementById('btnToggleMod');
        const wrapperBtnRefresh = document.getElementById('wrapperBtnRefresh');
        const infoKoordinatNota = document.getElementById('infoKoordinatNota');

        let isManualMode = false;

        // 1. Fungsi mendapatkan Lokasi GPS Semasa
        function dapatkanLokasi() {
            if (isManualMode) return;

            // Papar status sedang mencari
            statusLokasi.className = "flex items-start p-3 rounded-lg bg-blue-50 text-blue-700 text-sm border border-blue-200 transition-colors duration-300";
            statusIcon.className = "w-5 h-5 mr-2 mt-0.5 animate-pulse flex-shrink-0";
            statusIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>`;
            statusText.innerText = "Mengemas kini lokasi GPS semasa...";

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        latInput.value = position.coords.latitude.toFixed(6);
                        lngInput.value = position.coords.longitude.toFixed(6);
                        
                        // Kemas kini UI kepada Berjaya
                        statusLokasi.className = "flex items-start p-3 rounded-lg bg-green-50 text-green-700 text-sm border border-green-200 transition-colors duration-300";
                        statusText.innerHTML = `<strong>Lokasi GPS Dikemas Kini:</strong><br>Lat: ${latInput.value}, Lng: ${lngInput.value}`;
                        
                        statusIcon.className = "w-5 h-5 mr-2 mt-0.5 flex-shrink-0";
                        statusIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>`;

                        aktifkanButangHantar();
                    },
                    function(error) {
                        let errorMsg = "Ralat GPS.";
                        if (error.code === 1) errorMsg = "Akses lokasi ditolak. Sila benarkan akses GPS.";
                        if (error.code === 2) errorMsg = "Isyarat GPS tidak ditemui. Sila cuba mod manual.";
                        if (error.code === 3) errorMsg = "Masa tamat (Timeout) mencari GPS.";

                        statusLokasi.className = "flex items-start p-3 rounded-lg bg-red-50 text-red-700 text-sm border border-red-200 transition-colors duration-300";
                        statusText.innerText = errorMsg;
                        statusIcon.className = "w-5 h-5 mr-2 mt-0.5 flex-shrink-0";
                        statusIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>`;
                        
                        // Jika gagal, benarkan pengguna tukar ke manual
                        btnText.innerText = "GPS Gagal (Sila Cuba Manual)";
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            } else {
                statusText.innerText = "Pelayar tidak menyokong fungsi GPS.";
            }
        }

        // 2. Fungsi Tukar Mod Auto <-> Manual
        function tukarModInput() {
            isManualMode = !isManualMode;

            if (isManualMode) {
                // Tukar ke Mod Manual
                btnToggleMod.innerText = "Tukar ke Auto GPS";
                wrapperBtnRefresh.classList.add('hidden');
                
                // Buang attribute readonly supaya staf boleh taip koordinat
                latInput.removeAttribute('readonly');
                lngInput.removeAttribute('readonly');
                latInput.classList.add('bg-yellow-50', 'border-yellow-300');
                lngInput.classList.add('bg-yellow-50', 'border-yellow-300');

                statusLokasi.className = "flex items-start p-3 rounded-lg bg-amber-50 text-amber-800 text-sm border border-amber-200 transition-colors duration-300";
                statusIcon.className = "w-5 h-5 mr-2 mt-0.5 flex-shrink-0";
                statusIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>`;
                statusText.innerHTML = "<strong>Mod Manual Aktif:</strong> Sila masukkan koordinat Latitud dan Longitud secara manual.";
                infoKoordinatNota.innerText = "Anda boleh menaip nilai latitud & longitud baharu di atas.";
                
                aktifkanButangHantar();
            } else {
                // Tukar kembali ke Mod Auto GPS
                btnToggleMod.innerText = "Tukar ke Masukan Manual";
                wrapperBtnRefresh.classList.remove('hidden');

                latInput.setAttribute('readonly', true);
                lngInput.setAttribute('readonly', true);
                latInput.classList.remove('bg-yellow-50', 'border-yellow-300');
                lngInput.classList.remove('bg-yellow-50', 'border-yellow-300');

                infoKoordinatNota.innerText = "Koordinat dikemas kini secara automatik dari GPS peranti anda.";
                
                // Ambil semula lokasi semasa
                dapatkanLokasi();
            }
        }

        function aktifkanButangHantar() {
            btnSubmit.disabled = false;
            btnSubmit.classList.remove('bg-gray-400', 'cursor-not-allowed');
            btnSubmit.classList.add('bg-blue-600', 'hover:bg-blue-700', 'cursor-pointer', 'shadow-md');
            btnText.innerText = "Hantar Data Survey";
        }

        // Panggil fungsi dapatkan lokasi sebaik halaman dimuatkan
        window.addEventListener('load', dapatkanLokasi);

        // 3. Fungsi apabila borang dihantar
        surveyForm.addEventListener('submit', function(e) {
            e.preventDefault();

            btnSubmit.disabled = true;
            btnSubmit.classList.remove('bg-blue-600', 'hover:bg-blue-700');
            btnSubmit.classList.add('bg-blue-400', 'cursor-wait');
            btnText.innerHTML = `<svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white inline-block" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Menghantar...`;

            const dataObj = {
                nama: document.getElementById("nama").value,
                nota: document.getElementById("nota").value,
                lat: latInput.value,
                lng: lngInput.value,
                mod: isManualMode ? "Manual" : "GPS Auto"
            };

            // Simulasi penghantaran data ke sistem/database
            setTimeout(() => {
                bukaModal(`Data berjaya dihantar!<br><span class='text-xs text-gray-500'>Lokasi (${dataObj.lat}, ${dataObj.lng}) [${dataObj.mod}]</span>`);
                
                // Kosongkan nota tetapi kekalkan nama staf untuk memudahkan survey seterusnya
                document.getElementById("nota").value = "";
                
                // Jika dalam mod auto, kemas kini GPS sekali lagi untuk titik seterusnya
                if (!isManualMode) {
                    dapatkanLokasi();
                } else {
                    resetButang();
                }
            }, 1200);
        });

        function resetButang() {
            btnSubmit.disabled = false;
            btnSubmit.classList.remove('bg-blue-400', 'cursor-wait');
            btnSubmit.classList.add('bg-blue-600', 'hover:bg-blue-700');
            btnText.innerText = "Hantar Data Survey";
        }

        function bukaModal(mesej) {
            document.getElementById('modalMessage').innerHTML = mesej;
            successModal.classList.remove('hidden');
        }

        function tutupModal() {
            successModal.classList.add('hidden');
            resetButang();
        }
    </script>
</body>
</html>
