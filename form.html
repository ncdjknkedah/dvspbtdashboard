<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borang Survey Lapangan</title>
    <!-- Memuatkan Tailwind CSS untuk gaya rekaan moden -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* Latar belakang kelabu lembut */
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-6 md:p-8">
        
        <!-- Pengepala Borang -->
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-blue-100 text-blue-600 mb-3">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
            </div>
            <h2 class="text-2xl font-bold text-gray-800">Survey Lapangan</h2>
            <p class="text-sm text-gray-500 mt-1">Laporan Aktiviti Kawalan Denggi (ACD)</p>
        </div>

        <!-- Kotak Status GPS -->
        <div id="statusLokasi" class="flex items-start p-4 mb-6 rounded-lg bg-blue-50 text-blue-700 text-sm border border-blue-200 transition-colors duration-300">
            <svg id="statusIcon" class="w-5 h-5 mr-2 animate-pulse flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
            <span id="statusText">Sedang mendapatkan lokasi GPS anda... Sila 'Allow' atau 'Benarkan' jika diminta.</span>
        </div>

        <!-- Borang Utama -->
        <form id="surveyForm" class="space-y-4">
            
            <!-- Ruangan Nama -->
            <div>
                <label for="nama" class="block text-sm font-medium text-gray-700 mb-1">Nama Staf / Pasukan</label>
                <input type="text" id="nama" required placeholder="Cth: Ahmad atau Pasukan A" 
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
            </div>

            <!-- Ruangan Maklumat -->
            <div>
                <label for="nota" class="block text-sm font-medium text-gray-700 mb-1">Maklumat / Nota Survey</label>
                <textarea id="nota" rows="4" required placeholder="Masukkan maklumat kawalan, status pembiakan, dsb..." 
                          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all resize-none"></textarea>
            </div>

            <!-- Ruangan Tersembunyi (Hidden) untuk menyimpan koordinat -->
            <input type="hidden" id="lat">
            <input type="hidden" id="lng">

            <!-- Butang Hantar -->
            <button type="submit" id="btnSubmit" disabled 
                    class="w-full mt-4 bg-gray-400 text-white font-semibold py-3 px-4 rounded-lg cursor-not-allowed transition-all duration-300 flex justify-center items-center">
                <span id="btnText">Menunggu Lokasi...</span>
            </button>
        </form>
    </div>

    <!-- Custom Modal (Menggantikan fungsi alert()) -->
    <div id="successModal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4 transition-opacity duration-300">
        <div class="bg-white rounded-2xl shadow-2xl p-6 w-full max-w-sm text-center transform scale-100 transition-transform duration-300">
            <div class="mx-auto flex items-center justify-center h-16 w-16 rounded-full bg-green-100 mb-4">
                <svg class="h-8 w-8 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                </svg>
            </div>
            <h3 class="text-xl font-bold text-gray-900 mb-2">Berjaya!</h3>
            <p class="text-gray-600 text-sm mb-6" id="modalMessage">Data kaji selidik dan rekod GPS telah berjaya dihantar ke sistem.</p>
            <button type="button" onclick="tutupModal()" 
                    class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-2.5 px-4 rounded-lg transition-colors duration-200">
                Tutup & Sambung Tugas
            </button>
        </div>
    </div>

    <script>
        // DOM Elements
        const statusLokasi = document.getElementById('statusLokasi');
        const statusText = document.getElementById('statusText');
        const statusIcon = document.getElementById('statusIcon');
        const btnSubmit = document.getElementById('btnSubmit');
        const btnText = document.getElementById('btnText');
        const latInput = document.getElementById('lat');
        const lngInput = document.getElementById('lng');
        const surveyForm = document.getElementById('surveyForm');
        const successModal = document.getElementById('successModal');

        // 1. Dapatkan Lokasi Sebaik Sahaja Halaman Dibuka
        function dapatkanLokasi() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    // Jika Berjaya
                    function(position) {
                        latInput.value = position.coords.latitude;
                        lngInput.value = position.coords.longitude;
                        
                        // Ubah UI Status kepada Hijau (Berjaya)
                        statusLokasi.classList.remove('bg-blue-50', 'text-blue-700', 'border-blue-200');
                        statusLokasi.classList.add('bg-green-50', 'text-green-700', 'border-green-200');
                        statusText.innerHTML = `<strong>Lokasi Terkini Diperoleh:</strong><br>Lat: ${position.coords.latitude.toFixed(5)}, Lng: ${position.coords.longitude.toFixed(5)}`;
                        
                        // Ubah Icon kepada Checkmark
                        statusIcon.classList.remove('animate-pulse');
                        statusIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>`;

                        // Buka kunci butang hantar
                        btnSubmit.disabled = false;
                        btnSubmit.classList.remove('bg-gray-400', 'cursor-not-allowed');
                        btnSubmit.classList.add('bg-blue-600', 'hover:bg-blue-700', 'cursor-pointer', 'shadow-md');
                        btnText.innerText = "Hantar Data";
                    },
                    // Jika Gagal (Pengguna tolak akses, atau GPS tutup)
                    function(error) {
                        let errorMsg = "Ralat mendapatkan lokasi.";
                        if (error.code === 1) errorMsg = "Akses lokasi ditolak. Sila benarkan akses GPS pada pelayar anda.";
                        if (error.code === 2) errorMsg = "Isyarat GPS tidak ditemui. Pastikan Location dibuka.";
                        if (error.code === 3) errorMsg = "Masa tamat (Timeout) semasa mencari GPS.";

                        // Ubah UI Status kepada Merah (Ralat)
                        statusLokasi.classList.remove('bg-blue-50', 'text-blue-700', 'border-blue-200');
                        statusLokasi.classList.add('bg-red-50', 'text-red-700', 'border-red-200');
                        statusText.innerText = errorMsg;
                        
                        // Ubah Icon kepada pangkah (X)
                        statusIcon.classList.remove('animate-pulse');
                        statusIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>`;
                        
                        btnText.innerText = "GPS Gagal - Tidak Boleh Hantar";
                    },
                    // Tetapan GPS (minta paling tepat)
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            } else {
                statusText.innerText = "Peranti atau pelayar ini tidak menyokong fungsi GPS.";
                btnText.innerText = "Sistem Tidak Disokong";
            }
        }

        // Panggil fungsi dapatkan lokasi sebaik halaman siap dimuatkan
        window.addEventListener('load', dapatkanLokasi);

        // 2. Fungsi apabila borang dihantar
        surveyForm.addEventListener('submit', function(e) {
            e.preventDefault(); // Halang page reload

            // Tukar butang kepada status memproses
            btnSubmit.disabled = true;
            btnSubmit.classList.remove('bg-blue-600', 'hover:bg-blue-700');
            btnSubmit.classList.add('bg-blue-400', 'cursor-wait');
            btnText.innerHTML = `<svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white inline-block" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Menghantar...`;

            // Dapatkan Data dari borang
            const dataObj = {
                nama: document.getElementById("nama").value,
                nota: document.getElementById("nota").value,
                lat: latInput.value,
                lng: lngInput.value
            };

            /* --------------------------------------------------------------------------
               NOTA: Untuk integrasi Google Apps Script Sebenar, gunakan kod di bawah:
               --------------------------------------------------------------------------
               google.script.run
                .withSuccessHandler(function(responMesej) {
                    bukaModal(responMesej);
                    surveyForm.reset();
                    resetButang();
                })
                .simpanData(dataObj);
               -------------------------------------------------------------------------- */

            // UNTUK TUJUAN PREVIEW DI CANVAS INI (Simulasi Penghantaran 1.5 saat):
            setTimeout(() => {
                bukaModal("Data kaji selidik untuk '" + dataObj.nama + "' beserta rekod GPS telah berjaya dihantar!");
                surveyForm.reset(); // Kosongkan borang
                resetButang(); // Kembalikan keadaan butang
            }, 1500);
        });

        // 3. Helper Functions untuk UI
        function resetButang() {
            btnSubmit.disabled = false;
            btnSubmit.classList.remove('bg-blue-400', 'cursor-wait');
            btnSubmit.classList.add('bg-blue-600', 'hover:bg-blue-700');
            btnText.innerText = "Hantar Data";
        }

        function bukaModal(mesej) {
            document.getElementById('modalMessage').innerText = mesej;
            successModal.classList.remove('hidden');
        }

        function tutupModal() {
            successModal.classList.add('hidden');
        }
    </script>
</body>
</html>
